name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19

      - name: Install
        run: npm install

      - name: Validate ChSON files
        run: npm run validate

      - name: Typecheck shared packages
        run: npx turbo run typecheck --filter=@chson/schema --filter=@chson/cli

  registry-prototype:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19

      - name: Install root dependencies
        run: npm install

      - name: Install prototype registry dependencies
        run: npm --prefix examples/chson-shadcn-registry install

      - name: Build and validate prototype registry
        run: npm --prefix examples/chson-shadcn-registry run registry:check
